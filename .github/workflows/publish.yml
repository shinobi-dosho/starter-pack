name: Publish to PyPI

# Release-triggered, matching the rest of the organisation: the maintainer bumps
# `version` in pyproject.toml and publishes a GitHub Release. CI runs first --
# a release that cannot pass its own test suite should not reach PyPI, and PyPI
# does not allow a version to be re-uploaded even after deletion.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: no API token stored in the repo. Configure the
    # publisher once at https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
