[project]
name = "PROJECT_NAME"
version = "0.1.0b1"
description = "One line on what this does. Shows up on PyPI and in search results."
authors = [
    {name = "Sphesihle Makhathini", email = "sphemakh@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
# 3.11 floor, deliberately. It is the floor the rest of the organisation's
# packages carry, and mixing a lower one in a project that depends on them makes
# the resolver unsatisfiable rather than merely awkward.
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.3.3",
]

[project.scripts]
PROJECT_NAME = "project_name.cli:cli"

[project.urls]
Homepage = "https://github.com/shinobi-dosho/PROJECT_NAME"
Documentation = "https://PROJECT_NAME.readthedocs.io"
Repository = "https://github.com/shinobi-dosho/PROJECT_NAME"
"Issue Tracker" = "https://github.com/shinobi-dosho/PROJECT_NAME/issues"
Changelog = "https://github.com/shinobi-dosho/PROJECT_NAME/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.hatch.build.targets.sdist]
# Anchor patterns to the repo root (leading "/"); unanchored names match at any
# depth (gitignore semantics) and would drag in nested README/LICENSE files from
# .venv, docs/_build and the like.
include = [
    "/src/project_name",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
]

[dependency-groups]

ruff = [
    "ruff>=0.12.9",
]

tests = [
    "pytest>=7.1.3",
    "pytest-cov>=5.0",
    {include-group = "ruff"},
]

# Sphinx + Furo + autodoc. `uv sync --group docs`. Keep in sync with
# docs/requirements.txt, which is what Read the Docs installs.
docs = [
    "Sphinx>=7.2,<9.0",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
]

# Its own group rather than part of `tests`: every job in the test matrix
# installs `tests` and none of them audit, so folding it in there buys extra
# resolve-and-downloads to serve one job. No upper bound -- pip-audit is a
# client for PyPI's advisory API, and the useful version is whatever is current.
audit = [
    "pip-audit>=2.7",
]

dev = [
    {include-group = "tests"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# `select`, not `extend-select`. This list is the repo's *whole* ruleset, stated
# outright rather than inherited from whatever ruff happens to enable this
# month. Inheriting the default means a ruff release can turn an untouched
# `main` red, with nothing in the next PR to blame.
#
# Adopting a broader ruleset is a fine thing to decide -- but it should be
# decided. Extend this list deliberately.
[tool.ruff.lint]
select = [
    "F",     # pyflakes -- real errors: undefined names, unused imports
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort -- import sorting
    "C4",    # comprehension rewrites
    "DTZ",   # naive datetimes
    "ERA",   # commented-out code
    "EXE",   # shebang/executable-bit mismatches
    "FA",    # missing `from __future__ import annotations`
    "FURB",  # modernizations
    "G",     # logging call format (no f-strings in logger.* -- lazy % args)
    "ICN",   # conventional import aliases
    "ISC",   # implicit string concatenation
    "LOG",   # logging misuse
    "PGH",   # blanket `# noqa` / `# type: ignore` without a code
    "Q",     # quote style
    "RSE",   # `raise X()` not `raise X`
    "T10",   # stray debugger imports
    "T20",   # stray `print` (output goes through click/logging)
    "TID",   # relative-import hygiene
    "YTT",   # sys.version misuse
]

# Families deliberately NOT selected. Each is a real decision to make, not an
# oversight -- opt one in by moving it up and clearing its findings:
#
#   B      flake8-bugbear
#   SIM    nested `with` merges and similar
#   UP     `Optional[X]` -> `X | None`
#   RUF    incl. unused-`noqa` for rules not selected above
#   PL     pylint port
#   ANN / D / S  -- annotations, docstring style, bandit; each is a
#          project-wide policy choice, not a cleanup
